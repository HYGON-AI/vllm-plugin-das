GLM-5-Channel-INT8-w8a8:
  env:
    LMSLIM_USE_GLOBAL_MOE_CACHE: 1
    VLLM_USE_MODELSCOPE: 1
  evalscope:
    datasets:
    - swe_bench_lite_agentic
    - mcp_atlas
    - ifbench
    - bfcl_v3
    - humaneval
    - gsm8k
    - math_500
    limit: 50
    dataset_args:
      swe_bench_lite_agentic:
        limit: 5
      mcp_atlas:
        limit: 5
  model: GLM-5-Channel-INT8-w8a8
  server: vllm
  server_args:
    attention-backend: FLASHMLA_SPARSE
    block-size: 64
    dtype: bfloat16
    gpu-memory-utilization: 0.92
    kv-cache-dtype: fp8_ds_mla
    max-model-len: 65536
    max-num-batched-tokens: 8192
    max-num-seqs: 64
    quantization: slimquant_marlin
    speculative_config: '{"method": "deepseek_mtp", "num_speculative_tokens": 2, "quantization": "slimquant_marlin"}'
    tensor-parallel-size: 8
    trust-remote-code: true
    enable-auto-tool-choice: true
    tool-call-parser: glm47
  type: precision
Hy3-Channel-FP8-w8a8:
  env:
    VLLM_HCU_USE_CUSTOM_FLASH_ATTN: 1
    GPU_MAX_HW_QUEUES: 4
  evalscope:
    datasets:
    - swe_bench_lite_agentic
    - mcp_atlas
    - ifbench
    - bfcl_v3
    - humaneval
    - gsm8k
    - math_500
    limit: 50
    dataset_args:
      swe_bench_lite_agentic:
        limit: 5
      mcp_atlas:
        limit: 5
  model: Hy3-Channel-FP8-w8a8
  server: vllm
  server_args:
    enable-prefix-caching: true
    gpu-memory-utilization: 0.92
    kv-cache-dtype: fp8_e4m3
    quantization: slimquant_marlin
    speculative-config.method: mtp
    speculative-config.num_speculative_tokens: 2
    speculative-config.quantization: slimquant_marlin
    tensor-parallel-size: 8
    trust-remote-code: true
    enable-auto-tool-choice: true
    tool-call-parser: hy_v3
    reasoning-parser: hy_v3
  type: precision
