name: Cookbook deployment smoke (vLLM)

on:
  workflow_call:
    inputs:
      image:
        description: Exact dated image built and pushed by the caller
        type: string
        required: true
      image-id:
        description: Immutable image ID recorded by the image build
        type: string
        default: ''
      hardware:
        description: BW1100 only during ARC migration; legacy all selects BW1100
        type: string
        default: BW1100
      mode:
        description: preflight or execute
        type: string
        default: execute
      cases:
        description: Exact Cookbook sections; select one hardware for hardware-specific sections
        type: string
        default: ''
    secrets:
      MODEL_REPORT_HISTORY_TOKEN:
        description: Read Actions artifacts in both HYGON-AI framework repositories
        required: true
      MODEL_SMOKE_REPO_TOKEN:
        required: true
      DASHHUB_CI_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      hardware:
        description: BW1100 only; BW1000 is paused during ARC migration
        type: choice
        options: [BW1100]
        default: BW1100
      mode:
        description: First run preflight; then execute
        type: choice
        options: [preflight, execute]
        default: preflight
      image:
        description: Dated vllm 0.28.1 image; empty selects the newest dated image once
        type: string
        default: ''
      cases:
        description: Exact Cookbook sections; empty tests all single-host deployments per hardware
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cookbook-deployment-smoke-vllm
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: hygon-cpu
    timeout-minutes: 45
    outputs:
      enabled: ${{ steps.prepare.outputs.enabled }}
      image: ${{ steps.prepare.outputs.image_ref }}
      container-image: ${{ steps.prepare.outputs.container_image }}
      image-id: ${{ steps.prepare.outputs.image_id }}
      cookbook-ref: ${{ steps.prepare.outputs.cookbook_ref }}
      controller-ref: ${{ steps.prepare.outputs.controller_ref }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Validate ARC hardware selection
        env:
          REQUESTED_HARDWARE: ${{ inputs.hardware || 'BW1100' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_HARDWARE" in
            BW1100|all) ;;
            *) echo "::error::Only BW1100 is enabled; BW1000 model tests are paused during ARC migration."; exit 2 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: guochenyang99/ci-model-test
          ref: main
          token: ${{ secrets.MODEL_SMOKE_REPO_TOKEN }}
          persist-credentials: false
          path: model-ci-tools
      - id: prepare
        uses: ./model-ci-tools/.github/actions/deployment-smoke-prepare
        with:
          framework: vllm
          framework-version: '0.28.1'
          image: ${{ inputs.image || '' }}
          image-id: ${{ inputs.image-id || '' }}
          backend: arc
          # Do not generate BW1000 cases even for callers still passing all.
          hardware: BW1100

  smoke:
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Smoke (${{ matrix.hardware }})
    runs-on: hygon-bw1100-8card
    timeout-minutes: 840
    container:
      # ARC creates the job Pod and allocates all eight HCU devices.
      image: ${{ needs.prepare.outputs.container-image }}
    steps:
      - name: Checkout pinned private test controller
        uses: actions/checkout@v4
        with:
          repository: guochenyang99/ci-model-test
          ref: ${{ needs.prepare.outputs.controller-ref }}
          token: ${{ secrets.MODEL_SMOKE_REPO_TOKEN }}
          persist-credentials: false
          path: model-ci-tools
      - name: Test this hardware and transfer evidence
        uses: ./model-ci-tools/.github/actions/deployment-smoke-arc
        with:
          framework: vllm
          framework-version: '0.28.1'
          image: ${{ needs.prepare.outputs.image }}
          container-image: ${{ needs.prepare.outputs.container-image }}
          expected-image-id: ${{ needs.prepare.outputs.image-id }}
          cookbook-ref: ${{ needs.prepare.outputs.cookbook-ref }}
          controller-ref: ${{ needs.prepare.outputs.controller-ref }}
          hardware: ${{ matrix.hardware }}
          cases: ${{ inputs.cases || '' }}
          mode: ${{ inputs.mode || 'execute' }}
          collect-only: 'true'
