name: Cookbook deployment smoke (vLLM)

on:
  workflow_call:
    inputs:
      image:
        description: Exact dated image built and pushed by the caller
        type: string
        required: true
      image-id:
        description: Immutable image ID recorded by the image build
        type: string
        default: ''
      hardware:
        description: all, BW1100 or BW1000
        type: string
        default: all
      mode:
        description: preflight or execute
        type: string
        default: execute
      cases:
        description: Exact Cookbook sections; select one hardware for hardware-specific sections
        type: string
        default: ''
    secrets:
      MODEL_REPORT_HISTORY_TOKEN:
        description: Read Actions artifacts in both HYGON-AI framework repositories
        required: true
      MODEL_SMOKE_REPO_TOKEN:
        required: true
      DASHHUB_CI_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      hardware:
        description: all runs both hardware suites in parallel
        type: choice
        options: [all, BW1100, BW1000]
        default: all
      mode:
        description: First run preflight; then execute
        type: choice
        options: [preflight, execute]
        default: preflight
      image:
        description: Dated vllm 0.28.1 image; empty selects the newest dated image once
        type: string
        default: ''
      cases:
        description: Exact Cookbook sections; empty tests all single-host deployments per hardware
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cookbook-deployment-smoke-vllm-docker-glm51-baseline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: bw1100
    timeout-minutes: 45
    outputs:
      enabled: ${{ steps.prepare.outputs.enabled }}
      image: ${{ steps.prepare.outputs.image_ref }}
      image-id: ${{ steps.prepare.outputs.image_id }}
      cookbook-ref: ${{ steps.prepare.outputs.cookbook_ref }}
      controller-ref: ${{ steps.prepare.outputs.controller_ref }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: guochenyang99/ci-model-test
          ref: 10121ae687211bd39babd9b8eca6a558431c381c
          token: ${{ secrets.MODEL_SMOKE_REPO_TOKEN }}
          persist-credentials: false
          path: model-ci-tools
      - id: prepare
        uses: ./model-ci-tools/.github/actions/deployment-smoke-prepare
        with:
          framework: vllm
          framework-version: '0.28.1'
          image: ${{ inputs.image || '' }}
          image-id: ${{ inputs.image-id || '' }}
          hardware: ${{ inputs.hardware || 'all' }}

  smoke:
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Smoke (${{ matrix.hardware }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - name: Checkout pinned private test controller
        uses: actions/checkout@v4
        with:
          repository: guochenyang99/ci-model-test
          ref: ${{ needs.prepare.outputs.controller-ref }}
          token: ${{ secrets.MODEL_SMOKE_REPO_TOKEN }}
          persist-credentials: false
          path: model-ci-tools
      - name: Start Docker model memory sampling
        shell: bash
        run: |
          sample="$RUNNER_TEMP/glm51-memory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$sample"
          (
            while [[ ! -f "$sample/stop" ]]; do
              printf '\n[Docker memory] %s\n' "$(date -u +'%FT%TZ')"
              grep -E '^(MemAvailable|SwapFree):' /proc/meminfo || true
              while IFS= read -r id; do
                [[ -n "$id" ]] || continue
                timeout 5s docker stats --no-stream --format '{{.Name}} memory={{.MemUsage}} percent={{.MemPerc}}' "$id" || true
                timeout 5s docker exec "$id" bash -c '
                  for file in /sys/fs/cgroup/memory.{current,peak,max,events} /sys/fs/cgroup/memory/memory.{usage_in_bytes,max_usage_in_bytes,limit_in_bytes,failcnt}; do
                    if [ -r "$file" ]; then printf "%s: " "$file"; tr "\n" " " < "$file"; printf "\n"; fi
                  done
                ' || true
              done < <(timeout 5s docker ps --filter label=deployment-smoke.run --filter "label=deployment-smoke.github-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-vllm-bw1100" --format '{{.ID}}')
              sleep 5
            done
          ) > "$sample/memory.log" 2>&1 < /dev/null &
      - name: Test this hardware and transfer evidence
        uses: ./model-ci-tools/.github/actions/deployment-smoke
        with:
          framework: vllm
          framework-version: '0.28.1'
          image: ${{ needs.prepare.outputs.image }}
          expected-image-id: ${{ needs.prepare.outputs.image-id }}
          cookbook-ref: 12b4e51586c08dc299714875a946df8d0d8fb557
          controller-ref: ${{ needs.prepare.outputs.controller-ref }}
          hardware: ${{ matrix.hardware }}
          cases: ${{ inputs.cases || '' }}
          mode: ${{ inputs.mode || 'execute' }}
          collect-only: 'true'
      - name: Print Docker memory samples
        if: always()
        shell: bash
        run: |
          sample="$RUNNER_TEMP/glm51-memory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$sample" ]]; then
            touch "$sample/stop"
            cat "$sample/memory.log"
          fi
      - name: Upload Docker memory samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-glm51-memory
          path: ${{ runner.temp }}/glm51-memory-${{ github.run_id }}-${{ github.run_attempt }}/memory.log
          if-no-files-found: warn
