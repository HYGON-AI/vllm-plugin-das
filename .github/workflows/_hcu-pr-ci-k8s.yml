name: ARC v0.28.1 PR contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  resolve-image:
    name: Pin ARC job image
    runs-on: hygon-cpu
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve release image without a Docker daemon
        id: image
        env:
          SOURCE_IMAGE: ${{ vars.HCU_CI_IMAGE_V0281 || '10.16.1.152:5000/jenkins/model_test_env/vllm:0.28.1rc1-latest' }}
        run: python3 .github/scripts/hcu_ci/prepare_hcu_k8s.py image --github-output "$GITHUB_OUTPUT"

  static-and-select:
    name: ARC static gate and test selection
    needs: resolve-image
    runs-on: hygon-build
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    defaults:
      run:
        shell: bash
    outputs:
      has_jobs: ${{ steps.select.outputs.has_jobs }}
      arc_matrix: ${{ steps.pools.outputs.arc_matrix }}
      legacy_matrix: ${{ steps.pools.outputs.legacy_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          python3 --version
          python3 .github/scripts/hcu_ci/ensure_ci_dependencies.py --user
          python3 .github/scripts/hcu_ci/hcu_ci_preflight.py             --environment-lock .github/workflows/configs/hcu-runner-environment.json             --check-lock-only
          python3 .github/scripts/hcu_ci/compile_changed_python.py --base "$BASE_SHA" --head "$HEAD_SHA"
          python3 .github/scripts/hcu_ci/verify_hcu_registration.py
          python3 .github/scripts/hcu_ci/build_hcu_matrix.py --profile nightly >/dev/null
          python3 .github/scripts/hcu_ci/build_hcu_matrix.py --profile quarantine >/dev/null
          python3 tools/run_patch_tests.py --suite contract -- -o "cache_dir=$RUNNER_TEMP/hcu-ci-pytest-cache"
      - name: Select the unchanged registered test partitions
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_HCU: ${{ contains(github.event.pull_request.labels.*.name, 'full-hcu') }}
          ACCURACY_HCU: ${{ contains(github.event.pull_request.labels.*.name, 'accuracy-hcu') }}
        run: |
          set -euo pipefail
          source /opt/dtk/env.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$FULL_HCU" == "true" ]]; then args+=(--full); fi
          if [[ "$ACCURACY_HCU" == "true" ]]; then args+=(--accuracy); fi
          python3 .github/scripts/hcu_ci/select_hcu_tests.py "${args[@]}" > "$RUNNER_TEMP/hcu-selection.json"
      - name: Map supported topologies without changing test selection
        id: pools
        env:
          MATRIX_JSON: ${{ steps.select.outputs.matrix }}
        run: |
          source /opt/dtk/env.sh
          python3 .github/scripts/hcu_ci/prepare_hcu_k8s.py matrix --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcu-arc-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcu-selection.json
          if-no-files-found: warn

  authorize-hcu:
    name: Authorize ARC hardware execution
    needs: static-and-select
    runs-on: hygon-cpu
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - name: Checkout trusted authorization helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Verify ready-hcu label authority
        id: authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/hcu_ci/check_hcu_ci_authorization.py

  hardware:
    name: ${{ matrix.id }} (ARC)
    needs: [resolve-image, static-and-select, authorize-hcu]
    if: >-
      needs.static-and-select.outputs.has_jobs == 'true' &&
      needs.authorize-hcu.outputs.authorized == 'true' &&
      needs.static-and-select.outputs.arc_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.static-and-select.outputs.arc_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      HCU_CI_JOB_ID: ${{ matrix.id }}
      HCU_CI_REGISTRY_JOB: ${{ matrix.registry_job }}
      HCU_CI_ARCH: ${{ matrix.arch }}
      HCU_CI_CARDS: ${{ matrix.cards }}
      HCU_CI_SUITE: ${{ matrix.suite }}
      HCU_CI_PARTITION_ID: ${{ matrix.partition_id }}
      HCU_CI_PARTITION_SIZE: ${{ matrix.partition_size }}
      HCU_CI_PYTEST_ARGS_JSON: ${{ toJSON(matrix.pytest_args) }}
      HCU_CI_REQUIREMENTS_JSON: ${{ toJSON(matrix.requirements) }}
      HCU_CI_ISOLATE_GENERATED_CODE: ${{ matrix.isolate_generated_code && '1' || '0' }}
      HCU_CI_IMAGE: ${{ needs.resolve-image.outputs.image }}
      HCU_CI_MODEL_ROOT: ${{ vars.HCU_CI_MODEL_ROOT }}
      HCU_CI_DATASET_ROOT: ${{ vars.HCU_CI_DATASET_ROOT }}
      HCU_CI_GPU_MEMORY_WAIT_TIMEOUT_S: ${{ vars.HCU_CI_GPU_MEMORY_WAIT_TIMEOUT_S || '600' }}
      HCU_CI_GPU_MEMORY_POLL_INTERVAL_S: ${{ vars.HCU_CI_GPU_MEMORY_POLL_INTERVAL_S || '15' }}
      VLLM_HCU_USE_FLASH_ATTN_UNIFIED: '1'
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_HCU_TEST_STRICT_RESOURCES: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare container-local reports
        run: echo "HCU_CI_JOB_ROOT=$RUNNER_TEMP/hcu-ci-$HCU_CI_JOB_ID" >> "$GITHUB_ENV"
      - name: Install plugin and selected job dependencies in the job container
        run: |
          bash scripts/ci/hcu/hcu_ci_run_k8s.sh bash -c '
            set -euo pipefail
            python3 -m pip install --no-deps --no-build-isolation -e .
            python3 .github/scripts/hcu_ci/ensure_ci_dependencies.py
            python3 -c "import importlib.metadata as m; print({n: m.version(n) for n in (\"pytest\", \"torch\", \"vllm\")})"
            python3 .github/scripts/hcu_ci/ensure_evalscope.py
          '
      - name: Run unchanged preflight and registered test partition
        run: bash scripts/ci/hcu/hcu_ci_run_k8s.sh python3 .github/scripts/hcu_ci/run_hcu_ci_job.py
      - name: Upload HCU logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcu-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcu-ci-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 30

  isolated-hardware:
    name: Hardened generated-code tests
    needs: [resolve-image, static-and-select, authorize-hcu]
    if: >-
      needs.static-and-select.outputs.has_jobs == 'true' &&
      needs.authorize-hcu.outputs.authorized == 'true' &&
      needs.static-and-select.outputs.legacy_matrix != '[]'
    uses: ./.github/workflows/_selected-hcu-tests.yml
    with:
      matrix: ${{ needs.static-and-select.outputs.legacy_matrix }}
      tested_ref: ${{ github.event.pull_request.head.sha }}
      image: ${{ needs.resolve-image.outputs.image }}

  result:
    name: ARC lane result
    if: always()
    needs: [resolve-image, static-and-select, authorize-hcu, hardware, isolated-hardware]
    runs-on: ubuntu-latest
    env:
      IMAGE_RESULT: ${{ needs.resolve-image.result }}
      STATIC_RESULT: ${{ needs.static-and-select.result }}
      AUTH_RESULT: ${{ needs.authorize-hcu.result }}
      AUTHORIZED: ${{ needs.authorize-hcu.outputs.authorized }}
      HAS_JOBS: ${{ needs.static-and-select.outputs.has_jobs }}
      ARC_MATRIX: ${{ needs.static-and-select.outputs.arc_matrix }}
      LEGACY_MATRIX: ${{ needs.static-and-select.outputs.legacy_matrix }}
      ARC_RESULT: ${{ needs.hardware.result }}
      LEGACY_RESULT: ${{ needs.isolated-hardware.result }}
    steps:
      - name: Require every selected partition to pass
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMAGE_RESULT" != success || "$STATIC_RESULT" != success || "$AUTH_RESULT" != success ]]; then
            echo "Image resolution, static contracts or trusted authorization failed." >&2
            exit 1
          fi
          if [[ "$HAS_JOBS" != true && "$HAS_JOBS" != false ]]; then
            echo "Selector did not publish an explicit has_jobs result." >&2
            exit 1
          fi
          if [[ "$HAS_JOBS" == true && "$ARC_MATRIX" == '[]' && "$LEGACY_MATRIX" == '[]' ]]; then
            echo "Selected jobs cannot disappear during backend mapping." >&2
            exit 1
          fi
          if [[ "$HAS_JOBS" == true && "$AUTHORIZED" != true ]]; then
            echo "Selected HCU tests require a trusted author or ready-hcu approval." >&2
            exit 1
          fi
          if [[ "$ARC_MATRIX" != '[]' && "$ARC_RESULT" != success ]]; then
            echo "One or more selected ARC jobs did not pass." >&2
            exit 1
          fi
          if [[ "$LEGACY_MATRIX" != '[]' && "$LEGACY_RESULT" != success ]]; then
            echo "One or more hardened generated-code jobs did not pass." >&2
            exit 1
          fi
