name: HCU v0.33 release contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [v0.33.0]
  push:
    branches: [v0.33.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcu-v033-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_jobs: ${{ steps.select.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release and selector contracts
        env:
          RELEASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          test "$RELEASE_REF" = v0.33.0
          python -B -m unittest discover -s tests/ci -v
      - name: Select this release without the legacy registry
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf '%s\n' adapter_extension/ > changed-v033.txt
          else
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > changed-v033.txt
          fi
          python .github/scripts/hcu_ci/select_hcu_tests.py --release v0.33.0 \
            --paths-from changed-v033.txt --github-output "$GITHUB_OUTPUT" > selection-v033.json
      - uses: actions/upload-artifact@v4
        with:
          name: v033-selection
          path: selection-v033.json

  v033-source-contract:
    needs: select
    if: needs.select.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: 4ba787ec9959e566d3b587a796dff07673324da5
          path: target-vllm
          persist-credentials: false
      - run: python -m pip install pytest packaging 'setuptools>=77' wheel
      - name: Source and packaging contracts (CPU only)
        env:
          VLLM_TARGET_ROOT: ${{ github.workspace }}/target-vllm
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier source --junit v033-source.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v033-source-contract
          path: v033-source.xml

  authorize-device:
    needs: select
    if: needs.select.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.pr-authorization.outputs.authorized || steps.release-authorization.outputs.authorized }}
    steps:
      - name: Checkout trusted PR authorization helper
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Reuse existing HCU author and ready-hcu checks
        if: github.event_name == 'pull_request'
        id: pr-authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B .github/scripts/hcu_ci/check_hcu_ci_authorization.py
      - name: Authorize release push or manual run
        if: github.event_name != 'pull_request'
        id: release-authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/v0.33.0 || ( "$EVENT_NAME" != push && "$EVENT_NAME" != workflow_dispatch ) ]]; then
            echo 'Hardware execution requires a push or manual run on v0.33.0' >&2
            exit 2
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  resolve-device-image:
    needs: [select, authorize-device]
    if: needs.select.outputs.has_jobs == 'true' && needs.authorize-device.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Require a prepared v0.33 image
        id: image
        env:
          HCU_CI_IMAGE_V033: ${{ vars.HCU_CI_IMAGE_V033 }}
          HARBOR_SITE: ${{ vars.HARBOR_SITE }}
        run: |
          set -euo pipefail
          if [[ -z "${HARBOR_SITE:-}" || "$HARBOR_SITE" =~ [[:space:]/@] ]]; then
            echo 'HARBOR_SITE must name the approved registry host, without a scheme or path' >&2
            exit 2
          fi
          if [[ -z "${HCU_CI_IMAGE_V033//[[:space:]]/}" ]]; then
            echo 'HCU_CI_IMAGE_V033 must name a prepared v0.33 DTK/Core/Adapter/vendor image' >&2
            exit 2
          fi
          allowed_repository="${HARBOR_SITE}/jenkins/model_test_env/vllm"
          if [[ "${HCU_CI_IMAGE_V033%@*}" != "$allowed_repository" \
              || ! "${HCU_CI_IMAGE_V033##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'HCU_CI_IMAGE_V033 must be an immutable sha256 digest in the approved vllm repository' >&2
            exit 2
          fi
          printf 'image=%s\n' "$HCU_CI_IMAGE_V033" >> "$GITHUB_OUTPUT"

  v033-device-gfx936:
    needs: [select, authorize-device, resolve-device-image]
    if: needs.select.outputs.has_jobs == 'true' && needs.authorize-device.outputs.authorized == 'true'
    runs-on: [self-hosted, ci, bw1000]
    permissions:
      contents: read
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-device-image.outputs.image }}
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
      volumes:
        - /opt/hyhal:/opt/hyhal:ro
      options: --device=/dev/kfd --device=/dev/dri --group-add video --shm-size=32g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Full v0.33 portable contracts (devices hidden)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier portable --junit v033-portable.xml
      - name: Installed Plugin operator and Graph contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier device --junit v033-device.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v033-device-gfx936
          path: |
            v033-portable.xml
            v033-device.xml

  v033-device-gfx938:
    needs: [select, authorize-device, resolve-device-image]
    if: needs.select.outputs.has_jobs == 'true' && needs.authorize-device.outputs.authorized == 'true'
    runs-on: [self-hosted, ci, bw1100]
    permissions:
      contents: read
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-device-image.outputs.image }}
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
      volumes:
        - /opt/hyhal:/opt/hyhal:ro
      options: --device=/dev/kfd --device=/dev/dri --group-add video --shm-size=32g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Installed Channel-FP8 DeepGEMM numerical contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier device-gfx938 --junit v033-device.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v033-device-gfx938
          path: v033-device.xml

  v033-ci-gate:
    if: always()
    needs: [select, v033-source-contract, authorize-device, resolve-device-image, v033-device-gfx936, v033-device-gfx938]
    runs-on: ubuntu-latest
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      HAS_JOBS: ${{ needs.select.outputs.has_jobs }}
      SOURCE_RESULT: ${{ needs.v033-source-contract.result }}
      AUTH_RESULT: ${{ needs.authorize-device.result }}
      AUTHORIZED: ${{ needs.authorize-device.outputs.authorized }}
      IMAGE_RESULT: ${{ needs.resolve-device-image.result }}
      GFX938_RESULT: ${{ needs.v033-device-gfx938.result }}
      DEVICE_RESULT: ${{ needs.v033-device-gfx936.result }}
    steps:
      - name: Require each selected stage to pass
        run: |
          [[ "$SELECT_RESULT" == success ]] || exit 1
          if [[ "$HAS_JOBS" == false ]]; then
            exit 0
          fi
          [[ "$HAS_JOBS" == true && "$SOURCE_RESULT" == success ]] || exit 1
          if [[ "$AUTH_RESULT" != success || "$AUTHORIZED" != true ]]; then
            echo 'Selected HCU tests require a trusted author or trusted ready-hcu authorization' >&2
            exit 1
          fi
          [[ "$IMAGE_RESULT" == success && "$DEVICE_RESULT" == success && "$GFX938_RESULT" == success ]] || exit 1
