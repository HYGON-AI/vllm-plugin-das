name: HCU v0.33 release contracts

on:
  # pull_request_target lets fork PRs read repository variables. The workflow
  # definition and authorization helper are taken from the base revision; PR
  # head code runs only after trusted author/ready-hcu authorization.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [v0.33.0]
  push:
    branches: [v0.33.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcu-v033-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_jobs: ${{ steps.select.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release and selector contracts
        env:
          RELEASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          test "$RELEASE_REF" = v0.33.0
          python -B -m unittest discover -s tests/ci -v
          python -I -B -m unittest discover -s skills/upgrading-vllm-hcu-upstream-first/scripts -v
      - name: Select this release without the legacy registry
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf '%s\n' adapter_extension/ > changed-v033.txt
          else
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > changed-v033.txt
          fi
          python .github/scripts/hcu_ci/select_hcu_tests.py --release v0.33.0 \
            --paths-from changed-v033.txt --github-output "$GITHUB_OUTPUT" > selection-v033.json
      - uses: actions/upload-artifact@v4
        with:
          name: v033-selection
          path: selection-v033.json

  v033-source-contract:
    needs: select
    if: needs.select.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: 4ba787ec9959e566d3b587a796dff07673324da5
          path: target-vllm
          persist-credentials: false
      - run: python -m pip install pytest packaging 'setuptools>=77' wheel
      - name: Source and packaging contracts (CPU only)
        env:
          VLLM_TARGET_ROOT: ${{ github.workspace }}/target-vllm
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier source --junit v033-source.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v033-source-contract
          path: v033-source.xml

  authorize-device:
    needs: select
    if: needs.select.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.pr-authorization.outputs.authorized || steps.release-authorization.outputs.authorized }}
    steps:
      - name: Checkout trusted PR authorization helper
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Reuse existing HCU author and ready-hcu checks
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        id: pr-authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B .github/scripts/hcu_ci/check_hcu_ci_authorization.py
      - name: Authorize release push or manual run
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        id: release-authorization
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/v0.33.0 || ( "$EVENT_NAME" != push && "$EVENT_NAME" != workflow_dispatch ) ]]; then
            echo 'Hardware execution requires a push or manual run on v0.33.0' >&2
            exit 2
          fi
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  resolve-device-image:
    needs: [select, authorize-device]
    if: needs.select.outputs.has_jobs == 'true' && needs.authorize-device.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      runner_mode: ${{ steps.image.outputs.runner_mode }}
      gfx936_runner: ${{ steps.image.outputs.gfx936_runner }}
      gfx938_runner: ${{ steps.image.outputs.gfx938_runner }}
      container_options: ${{ steps.image.outputs.container_options }}
    steps:
      - name: Resolve prepared image and runner backend
        id: image
        env:
          HCU_CI_IMAGE_V033: ${{ vars.HCU_CI_IMAGE_V033 }}
          HARBOR_SITE: ${{ vars.HARBOR_SITE }}
          # Default to ARC/K8s; set legacy explicitly to roll back.
          HCU_CI_RUNNER_MODE_V033: ${{ vars.HCU_CI_RUNNER_MODE_V033 }}
        run: |
          set -euo pipefail
          if [[ -z "${HARBOR_SITE:-}" || "$HARBOR_SITE" =~ [[:space:]/@] ]]; then
            echo 'HARBOR_SITE must name the approved registry host, without a scheme or path' >&2
            exit 2
          fi
          if [[ -z "${HCU_CI_IMAGE_V033//[[:space:]]/}" ]]; then
            echo 'HCU_CI_IMAGE_V033 must name a prepared v0.33 DTK/Core/Adapter/vendor image' >&2
            exit 2
          fi
          # The Plugin release image and Adapter's prepared v0.33 runtime are
          # both approved sources; anything else fails before the device job.
          release_repository="${HARBOR_SITE}/jenkins/model_test_env/vllm"
          runtime_repository="${HARBOR_SITE}/hcu/base_env/vllm"
          if [[ ( "${HCU_CI_IMAGE_V033%@*}" != "$release_repository" \
                  && "${HCU_CI_IMAGE_V033%@*}" != "$runtime_repository" ) \
              || ! "${HCU_CI_IMAGE_V033##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'HCU_CI_IMAGE_V033 must be an immutable sha256 digest in an approved vllm repository' >&2
            exit 2
          fi
          case "${HCU_CI_RUNNER_MODE_V033:-k8s}" in
            legacy)
              gfx936_runner='["self-hosted","ci","bw1000"]'
              gfx938_runner='["self-hosted","ci","bw1100"]'
              container_options='--device=/dev/kfd --device=/dev/dri --group-add video --shm-size=32g --volume=/opt/hyhal:/opt/hyhal:ro'
              ;;
            k8s)
              # ARC selects the node/devices and supplies the standard mounts.
              # Do not add self-hosted labels, host volumes or Docker options.
              gfx936_runner='"hygon-bw1000-1card"'
              gfx938_runner='"hygon-bw1100-1card"'
              container_options=''
              ;;
            *)
              echo 'HCU_CI_RUNNER_MODE_V033 must be legacy or k8s' >&2
              exit 2
              ;;
          esac
          {
            printf 'image=%s\n' "$HCU_CI_IMAGE_V033"
            printf 'runner_mode=%s\n' "${HCU_CI_RUNNER_MODE_V033:-k8s}"
            printf 'gfx936_runner=%s\n' "$gfx936_runner"
            printf 'gfx938_runner=%s\n' "$gfx938_runner"
            printf 'container_options=%s\n' "$container_options"
          } >> "$GITHUB_OUTPUT"

  v033-device-gfx936:
    needs: [select, authorize-device, resolve-device-image]
    if: needs.select.outputs.has_jobs == 'true' && needs.authorize-device.outputs.authorized == 'true'
    runs-on: ${{ fromJSON(needs.resolve-device-image.outputs.gfx936_runner) }}
    permissions:
      contents: read
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-device-image.outputs.image }}
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
      options: ${{ needs.resolve-device-image.outputs.container_options }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trust checked-out workspace for package metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Full v0.33 portable contracts (devices hidden)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier portable --junit v033-portable.xml
      - name: Installed Plugin operator and Graph contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier device --junit v033-device.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v033-device-gfx936
          path: |
            v033-portable.xml
            v033-device.xml

  v033-device-gfx938:
    needs: [select, authorize-device, resolve-device-image]
    if: needs.select.outputs.has_jobs == 'true' && needs.authorize-device.outputs.authorized == 'true'
    runs-on: ${{ fromJSON(needs.resolve-device-image.outputs.gfx938_runner) }}
    permissions:
      contents: read
    timeout-minutes: 45
    container:
      image: ${{ needs.resolve-device-image.outputs.image }}
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
      options: ${{ needs.resolve-device-image.outputs.container_options }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trust checked-out workspace for package metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Installed Channel-FP8 DeepGEMM numerical contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -I tools/run_v033_ci.py --tier device-gfx938 --junit v033-device.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v033-device-gfx938
          path: v033-device.xml

  v033-ci-gate:
    if: always()
    needs: [select, v033-source-contract, authorize-device, resolve-device-image, v033-device-gfx936, v033-device-gfx938]
    runs-on: ubuntu-latest
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      HAS_JOBS: ${{ needs.select.outputs.has_jobs }}
      SOURCE_RESULT: ${{ needs.v033-source-contract.result }}
      AUTH_RESULT: ${{ needs.authorize-device.result }}
      AUTHORIZED: ${{ needs.authorize-device.outputs.authorized }}
      IMAGE_RESULT: ${{ needs.resolve-device-image.result }}
      GFX938_RESULT: ${{ needs.v033-device-gfx938.result }}
      DEVICE_RESULT: ${{ needs.v033-device-gfx936.result }}
    steps:
      - name: Require each selected stage to pass
        run: |
          [[ "$SELECT_RESULT" == success ]] || exit 1
          if [[ "$HAS_JOBS" == false ]]; then
            exit 0
          fi
          [[ "$HAS_JOBS" == true && "$SOURCE_RESULT" == success ]] || exit 1
          if [[ "$AUTH_RESULT" != success || "$AUTHORIZED" != true ]]; then
            echo 'Selected HCU tests require a trusted author or trusted ready-hcu authorization' >&2
            exit 1
          fi
          [[ "$IMAGE_RESULT" == success && "$DEVICE_RESULT" == success && "$GFX938_RESULT" == success ]] || exit 1
