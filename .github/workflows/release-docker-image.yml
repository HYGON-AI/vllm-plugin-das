name: docker-image

on:
  workflow_dispatch:
    inputs:
      run_test:
        description: 构建完成并推送后, 自动触发 test-docker-image-daily 对该镜像跑 CItest
        required: false
        default: true
        type: boolean
  schedule:
    # 北京时间每天 22 点 (UTC 14:00)
    - cron: '0 14 * * *'

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_SITE: ${{ vars.HARBOR_SITE }}
  HARBOR_NAMESPACE: jenkins/model_test_env
  HCU_CI_IMAGE: ${{ vars.HCU_CI_IMAGE }}
  BASE_IMAGE: ${{ vars.DTK2604_IMAGE_UBUNTU_PY310 }}
  PYPI_URL: ${{ vars.PYPI_URL }}
  RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
  VLLM_VERSION: "0.25.1"
  TORCH_VERSION: "2.11.0"

jobs:
  build:
    # 需要能访问内网 pip 源 / AICC 下载地址 / Harbor 的自托管构建节点
    runs-on: bw18
    outputs:
      docker_image: ${{ steps.gen-tag.outputs.docker_image }}
    steps:
      - name: Repair self-hosted workspace before checkout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          blocked_path="$(find "$GITHUB_WORKSPACE" \( ! -uid "$uid" -o \( -type d ! -writable \) \) -print -quit 2>/dev/null || true)"
          if [[ -z "$blocked_path" ]]; then
            exit 0
          fi
          echo "repairing stale workspace ownership under $GITHUB_WORKSPACE"
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo chown -R "$uid:$gid" "$GITHUB_WORKSPACE"
          elif command -v docker >/dev/null 2>&1; then
            repair_images=()
            if [[ -n "${HCU_CI_IMAGE:-}" ]]; then
              repair_id="$(docker image inspect "$HCU_CI_IMAGE" --format '{{.Id}}' 2>/dev/null || true)"
              [[ -z "$repair_id" ]] || repair_images+=("$repair_id")
            fi
            while IFS= read -r repair_id; do
              [[ -z "$repair_id" ]] || repair_images+=("$repair_id")
            done < <(docker image ls --format '{{.ID}}' | awk '!seen[$0]++')
            repaired=false
            for repair_image in "${repair_images[@]}"; do
              if docker run --rm \
                  --user 0:0 \
                  --entrypoint /bin/sh \
                  --volume "$GITHUB_WORKSPACE:/workspace" \
                  "$repair_image" \
                  -c 'chown -R "$1:$2" /workspace' -- "$uid" "$gid"; then
                repaired=true
                break
              fi
            done
            if [[ "$repaired" != "true" ]]; then
              echo "No local Docker image could repair: $blocked_path" >&2
              exit 1
            fi
          else
            echo "Cannot repair non-writable workspace path: $blocked_path" >&2
            exit 1
          fi
          blocked_path="$(find "$GITHUB_WORKSPACE" \( ! -uid "$uid" -o \( -type d ! -writable \) \) -print -quit 2>/dev/null || true)"
          if [[ -n "$blocked_path" ]]; then
            echo "Workspace ownership or directory permissions are still invalid: $blocked_path" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取最新 AICC
        run: |
          if [[ -z "${RESOURCE_SERVER_URL}" ]]; then
            echo "缺少 vars.RESOURCE_SERVER_URL"
            exit 1
          fi
          AICC_URL="${RESOURCE_SERVER_URL}/ai_cc/nightly/"
          HTTP_CODE=$(curl -s --connect-timeout 10 -o /tmp/aicc_index.html -w "%{http_code}" "${AICC_URL}" || true)
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "无法访问 AICC nightly 索引 (HTTP ${HTTP_CODE}): ${AICC_URL}"
            echo "该 runner 可能不在内网, 检查本次 run 是否被分配到了正确的构建机"
            exit 1
          fi
          LATEST_AICC=$(grep -oP 'dtk_llvm_[^"]+\.run' /tmp/aicc_index.html | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
          if [ -z "${LATEST_AICC}" ]; then
            echo "AICC 索引页解析失败, 页面内容开头:"
            head -c 500 /tmp/aicc_index.html
            exit 1
          fi
          echo "AICC_URL=${AICC_URL}${LATEST_AICC}.run" >> "$GITHUB_ENV"
          echo "AICC_VERSION=${LATEST_AICC#dtk_llvm_}" >> "$GITHUB_ENV"

      - name: 生成镜像 tag
        id: gen-tag
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          BASE_VERSION=$(grep -oP '__version__ = "\K[^"]+' vllm_hcu/version.py)
          echo "IMAGE_TAG=vllm:${BASE_VERSION}-ubuntu22.04-dtk2604-py3.10-${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=vllm:${BASE_VERSION}-latest" >> "$GITHUB_ENV"
          echo "docker_image=${HARBOR_SITE}/${HARBOR_NAMESPACE}/vllm:${BASE_VERSION}-ubuntu22.04-dtk2604-py3.10-${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_SITE }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 构建镜像
        run: |
          FULL_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          FULL_LATEST_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"
          docker build \
            --network=host \
            --no-cache \
            -t "${FULL_TAG}" \
            -t "${FULL_LATEST_TAG}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "AICC_URL=${AICC_URL}" \
            --build-arg "AICC_VERSION=${AICC_VERSION}" \
            --build-arg "PYPI_URL=${PYPI_URL}" \
            --build-arg "RESOURCE_SERVER_URL=${RESOURCE_SERVER_URL}" \
            --build-arg "VLLM_VERSION=${VLLM_VERSION}" \
            --build-arg "TORCH_VERSION=${TORCH_VERSION}" \
            -f docker/Dockerfile \
            .

      - name: 推送镜像
        run: |
          docker push "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          docker push "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"

      # 其他容器 job 会以 root 在共享 workspace 留下文件, 导致下次 checkout 清理失败
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true

  # 镜像推送成功后, 对本次构建的具体镜像并行跑 CItest 与冒烟校验,
  # 两个测试 job 只依赖 build, 互不等待互不阻断
  test-image:
    if: github.event.inputs.run_test != 'false'
    needs: build
    uses: ./.github/workflows/daily-test-docker-image.yml
    with:
      docker_image: ${{ needs.build.outputs.docker_image }}
    secrets: inherit

  validate-image:
    needs: build
    uses: ./.github/workflows/validate-docker-image.yml
    with:
      image: ${{ needs.build.outputs.docker_image }}
    secrets: inherit
