name: docker-image

on:
  workflow_dispatch:
    inputs:
      run_test:
        description: 构建完成并推送后, 自动触发 test-docker-image-daily 对该镜像跑 CItest
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_SITE: ${{ vars.HARBOR_SITE }}
  HARBOR_NAMESPACE: jenkins/model_test_env
  HCU_CI_IMAGE: ${{ vars.HCU_CI_IMAGE }}
  PYPI_URL: ${{ vars.PYPI_URL }}
  RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
  VLLM_VERSION: "0.28.1"

jobs:
  build:
    # 需要能访问内网 pip 源 / AICC 下载地址 / Harbor 的自托管构建节点
    # 加镜像目标 = 改下面矩阵; image/DTK 版本号/输出 tag 全部按矩阵字段拼接,
    # 镜像总表格式: ${HARBOR_SITE}/hcu/base/dtk:<DTK版本>-<OS>-py<Python版本>
    runs-on: bw1100
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk_tag: "26.10"
            os_tag: "ubuntu22.04"
            python_version: "3.12"
            torch_version: "2.11.0"
            # AICC 大版本, 安装脚本 --major 装该版本中日期最新的包 (26.10 段为 2.0.0)
            aicc_major: "2.0.0"
            # blas cut 版本, 安装脚本按版本+os 拉归档最新包覆盖到 /opt/dtk
            blas_cut_version: "26.10"
    outputs:
      docker_image: ${{ steps.gen-tag.outputs.docker_image }}
    env:
      # 直接基于预装 DTK 的基础镜像构建, CI 内不再安装 DTK
      BASE_IMAGE: ${{ vars.DTK_BASE_IMAGE || format('{0}/hcu/base/dtk:{1}-{2}-py{3}', vars.HARBOR_SITE, matrix.dtk_tag, matrix.os_tag, matrix.python_version) }}
      TORCH_VERSION: ${{ matrix.torch_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成镜像 tag
        id: gen-tag
        env:
          DTK_TAG_NO_DOT: ${{ matrix.dtk_tag }}
        run: |
          DTK_TAG_NO_DOT="${DTK_TAG_NO_DOT//./}"
          # BUILD_TIME: 传给 Dockerfile 生成 /etc/image.info 的 built 段, 与产物 tag 时间段一致
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          BASE_VERSION=$(grep -oP '__version__ = "\K[^"]+' vllm_hcu/version.py)
          BASE_VERSION="${BASE_VERSION%%.dev*}"
          echo "IMAGE_TAG=vllm:${BASE_VERSION}-${{ matrix.os_tag }}-dtk${DTK_TAG_NO_DOT}-py${{ matrix.python_version }}-${BUILD_TIME}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=vllm:${BASE_VERSION}-latest" >> "$GITHUB_ENV"
          echo "docker_image=${HARBOR_SITE}/${HARBOR_NAMESPACE}/vllm:${BASE_VERSION}-${{ matrix.os_tag }}-dtk${DTK_TAG_NO_DOT}-py${{ matrix.python_version }}-${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: 登录 Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_SITE }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 构建镜像
        run: |
          FULL_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          FULL_LATEST_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"
          docker build \
            --network=host \
            --no-cache \
            -t "${FULL_TAG}" \
            -t "${FULL_LATEST_TAG}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "AICC_MAJOR=${{ matrix.aicc_major }}" \
            --build-arg "BLAS_CUT_VERSION=${{ matrix.blas_cut_version }}" \
            --build-arg "PYPI_URL=${PYPI_URL}" \
            --build-arg "RESOURCE_SERVER_URL=${RESOURCE_SERVER_URL}" \
            --build-arg "VLLM_VERSION=${VLLM_VERSION}" \
            --build-arg "TORCH_VERSION=${TORCH_VERSION}" \
            --build-arg "BUILD_TIME=${BUILD_TIME}" \
            -f docker/Dockerfile \
            .

      - name: 推送镜像
        run: |
          docker push "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          docker push "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"

      # 登记镜像记录(DashHub, 同 ciimage 的 record 口径): docker run 用产物镜像本身起
      # 临时容器(与 build 同一 runner, 天然主机亲和, 不用镜像不存在/多 runner 拉副本的
      # 问题), 容器里补装 cinotificate 后执行 --record_image; 上报哪个镜像以 -e
      # IMAGE_TAG 现配传入(镜像内没有烙该 ENV); 失败仅告警不阻断, 可稍后手动重试
      - name: 登记镜像记录(record)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          FULL_TAG="${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          TOKEN="${{ matrix.dtk_tag }}"
          TOKEN="dtk${TOKEN//./}"
          PYPI_HOST="${PYPI_URL#*://}"; PYPI_HOST="${PYPI_HOST%%/*}"; PYPI_HOST="${PYPI_HOST%%:*}"
          docker run --rm --network=host \
            -e "IMAGE_TAG=${FULL_TAG}" \
            --entrypoint /bin/bash "${FULL_TAG}" -c "
              set -e
              pip install cinotificate \
                -i '${PYPI_URL}/nightly/${TOKEN}/+simple/' \
                --trusted-host '${PYPI_HOST}'
              CInotificate --record_image
            "

      # 自托管构建机磁盘有限, record 完删除本地镜像释放空间;
      # 下游 validate-image 会自行从 Harbor 重新拉取, 不依赖本机镜像。
      # if: always(): 同 ref 的下一次 dispatch 会因 concurrency.cancel-in-progress
      # 取消本 job(continue-on-error 不覆盖取消语义), 默认 success() 会跳过本步骤,
      # 构建机将残留全部镜像层; 取消时先杀掉可能存活的 record 容器再删镜像
      - name: 删除本地镜像
        if: always()
        run: |
          docker ps --filter "ancestor=${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}" -q \
            | xargs -r docker rm -f \
            || true
          if ! docker rmi "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}" \
                         "${HARBOR_SITE}/${HARBOR_NAMESPACE}/${LATEST_TAG}"; then
            echo "::warning::删除本地镜像失败(可能被其他容器 job 占用), 磁盘有限请稍后手动清理: ${HARBOR_SITE}/${HARBOR_NAMESPACE}/${IMAGE_TAG}"
          fi

      # 其他容器 job 会以 root 在共享 workspace 留下文件, 导致下次 checkout 清理失败
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true

  # 镜像推送成功后, 对本次构建的具体镜像并行跑 CItest 与冒烟校验,
  # 两个测试 job 只依赖 build, 互不等待互不阻断
  test-image:
    if: github.event.inputs.run_test != 'false'
    needs: build
    uses: ./.github/workflows/daily-test-docker-image.yml
    with:
      docker_image: ${{ needs.build.outputs.docker_image }}
    secrets: inherit

  validate-image:
    needs: build
    uses: ./.github/workflows/validate-docker-image.yml
    with:
      image: ${{ needs.build.outputs.docker_image }}
    secrets: inherit
