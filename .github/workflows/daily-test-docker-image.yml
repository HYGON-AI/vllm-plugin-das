name: test-docker-image-daily

# Compatibility entry point: retain the old docker_image input and workflow name.
# Model tests, reports and DashHub submission run in ci-model-test; no Feishu notification.
on:
  workflow_call:
    inputs:
      docker_image:
        description: Exact dated vLLM 0.25.1 image to test
        required: true
        type: string
    secrets:
      MODEL_SMOKE_REPO_TOKEN:
        required: true
      DASHHUB_CI_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      docker_image:
        description: Dated vLLM 0.25.1 image; empty selects the newest dated image
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/cookbook-deployment-smoke.yml
    with:
      image: ${{ inputs.docker_image || '' }}
      mode: execute
    secrets: inherit
