name: test-docker-image-daily

# 由 docker-image (release-docker-image.yml) 构建并推送成功后作为 reusable workflow 被调用,
# 传入本次构建的镜像名; 也可手动触发, 留空 docker_image 时回落 0.28.1rc1.dev490-latest
on:
  workflow_call:
    inputs:
      docker_image:
        description: 待测试镜像完整路径, 例如 <site>/<ns>/vllm:0.28.1rc1.dev490-ubuntu22.04-dtk2604-py3.10-<时间戳>
        required: true
        type: string
  workflow_dispatch:
    inputs:
      docker_image:
        description: 待测试镜像完整路径; 留空使用 vllm:0.28.1rc1.dev490-latest
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: test-docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  TEST_IMAGE: ${{ inputs.docker_image || format('{0}/{1}/vllm:0.28.1rc1.dev490-latest', vars.HARBOR_SITE, vars.HARBOR_NAMESPACE) }}

jobs:
  citest:
    runs-on: bw1100
    container:
      image: ${{ inputs.docker_image || format('{0}/{1}/vllm:0.28.1rc1.dev490-latest', vars.HARBOR_SITE, vars.HARBOR_NAMESPACE) }}
      options: --privileged --cap-add=SYS_PTRACE --device /dev/kfd:/dev/kfd --device /dev/dri:/dev/dri --shm-size=1g
      volumes:
        - /public/opendas/DL_DATA/llm-models:/models/public:ro
        - /parastor/opendas/DL_DATA/llm-models:/models/parastor:ro
        - /usr/bin/docker:/usr/local/bin/docker:ro
        - /etc/docker/docker_env.conf:/etc/docker/docker_env.conf:ro
        - /opt/hyhal:/opt/hyhal:ro
    steps:
      - uses: actions/checkout@v4

      - name: 确认测试镜像
        run: echo "TEST_IMAGE=${{ env.TEST_IMAGE }}"

      - name: 安装 CItest
        run: |
          PYPI_HOST=$(echo "${PYPI_URL}" | sed -E 's#^https?://##; s#:.*##')
          pip install --upgrade --no-cache-dir citest[evalscope] evalscope cinotificate \
            -i "${PYPI_URL}/nightly/dtk2604/+simple/" \
            --trusted-host "${PYPI_HOST}"
          mkdir -p "${GITHUB_WORKSPACE}/citest-output"
          python3 -m pip list --format=json > "${GITHUB_WORKSPACE}/citest-output/evaluator-packages.json"

      - name: 运行 CItest
        id: evaluate
        continue-on-error: true
        run: |
          CItest --test_tool evalscope \
                 --case_conf docker/image-citest-conf-hcu.yaml \
                 --models_path /models \
                 --output_dir "${GITHUB_WORKSPACE}/citest-output"

      # CItest may return zero after a model failed to start or a sandbox
      # dataset was skipped. Check every configured model/dataset score.
      - name: 校验模型测试结果完整性
        if: always() && steps.evaluate.outcome != 'skipped'
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
        run: |
          python3 .github/scripts/model_ci/validate_daily_results.py \
            --case-conf docker/image-citest-conf-hcu.yaml \
            --output-dir "${GITHUB_WORKSPACE}/citest-output" \
            --evaluation-outcome "$EVALUATION_OUTCOME"

      - name: 展示模型测试完整性
        if: always()
        run: |
          if [ -f citest-output/completeness.md ]; then
            cat citest-output/completeness.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '模型测试未生成完整性报告，请检查前置步骤。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 飞书通知
        if: always() && steps.evaluate.outcome != 'skipped'
        run: |
          if [ ! -f "${GITHUB_WORKSPACE}/citest-output/notificate.json" ]; then
            echo 'CItest 未生成通知文件，请查看 Actions 汇总和归档日志。'
            exit 0
          fi
          CInotificate --modify_json "${GITHUB_WORKSPACE}/citest-output/notificate.json" \
                       --json_key docker_image_name \
                       --json_value "${{ env.TEST_IMAGE }}"
          CInotificate --modify_json "${GITHUB_WORKSPACE}/citest-output/notificate.json" \
                       --json_key jenkins_url \
                       --json_value "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CInotificate --notificate_conf "${GITHUB_WORKSPACE}/citest-output/notificate.json" \
                       --notificate_type PrecisionTest \
                       --group_name 框架发版对接 高性能推理加速部 --record

      - name: 归档测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citest-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: citest-output/**
          retention-days: 30

      # 其他容器 job 会以 root 在共享 workspace 留下文件, 导致下次 checkout 清理失败
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
