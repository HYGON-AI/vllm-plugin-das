name: test-docker-operator-daily

on:
  workflow_dispatch:
    inputs:
      image:
        description: 要测试的镜像全名
        required: true
        type: string
      record_dashhub:
        description: 上报算子结果及 CI 状态，DashHub 按镜像合并已有模型结果
        type: boolean
        default: false
  workflow_call:
    inputs:
      image:
        description: 要测试的镜像全名
        required: true
        type: string
      record_dashhub:
        description: 上报算子结果及 CI 状态，DashHub 按镜像合并已有模型结果
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-operator-test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYPI_URL: ${{ vars.PYPI_URL }}

jobs:
  optest:
    runs-on: bw1100
    timeout-minutes: 420
    container:
      image: ${{ inputs.image }}
      options: --privileged --cap-add=SYS_PTRACE --device /dev/kfd:/dev/kfd --device /dev/dri:/dev/dri
      volumes:
        - /public/opendas/DL_DATA/llm-models:/models/public:ro
        - /parastor/opendas/DL_DATA/llm-models:/models/parastor:ro
        - /usr/bin/docker:/usr/local/bin/docker:ro
        - /etc/docker/docker_env.conf:/etc/docker/docker_env.conf:ro
        - /opt/hyhal:/opt/hyhal:ro
    steps:
      - uses: actions/checkout@v4

      - name: 安装 optest
        run: |
          PYPI_HOST=$(echo "${PYPI_URL}" | sed -E 's#^https?://##; s#:.*##')
          pip install optest 'CInotificate>=0.0.34' \
            -i "${PYPI_URL}/nightly/dtk2610/+simple/" \
            --trusted-host "${PYPI_HOST}"

      - name: 运行 optest
        id: run_optest
        timeout-minutes: 360
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_TOKEN 为空, 检查组织 secret 的可见性, 以及调用方是否 secrets: inherit"
            exit 1
          fi
          optest --op_name all --test_mode all

      - name: 汇总算子结果
        if: always()
        run: |
          optest --json || true
          if [ ! -f /op_test_output/total_output.json ]; then
            mkdir -p /op_test_output
            printf '{"generated": "%s", "operators": []}\n' "$(date '+%Y-%m-%d %H:%M:%S')" \
              > /op_test_output/total_output.json
            echo "::warning::optest 未产出结果, 已写入空的 total_output.json 占位"
          fi
          ls -l /op_test_output/total_output.json

      - name: 上报 DashHub 记录
        if: ${{ always() && inputs.record_dashhub }}
        env:
          IMAGE_TAG: ${{ inputs.image }}
          OPTEST_OUTCOME: ${{ steps.run_optest.outcome }}
        run: |
          if [ "$OPTEST_OUTCOME" = success ]; then
            operator_status=ci_pass
          else
            operator_status=ci_fail
          fi
          CInotificate --notificate_type op_daily_display --record \
            --ci_accelerators BW1100 \
            --operator_result /op_test_output/total_output.json \
            --operator_test_status "$operator_status" -l DEBUG

      - name: 收集算子测试结果
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/optest-output"
          mkdir -p "${GITHUB_WORKSPACE}/optest-log"
          cp -a /op_test_output/. "${GITHUB_WORKSPACE}/optest-output/" || true
          cp -a /op_test_log/. "${GITHUB_WORKSPACE}/optest-log/" || true
          ls -l "${GITHUB_WORKSPACE}/optest-log"

      - name: 归档测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optest-operator-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            optest-output/**
            optest-log/**
          if-no-files-found: error

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
