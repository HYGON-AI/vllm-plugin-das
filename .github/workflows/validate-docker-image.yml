name: validate-docker-image

# 由 docker-image (release-docker-image.yml) 构建并推送成功后作为 reusable workflow 被调用,
# 传入本次构建的镜像名; 手动触发仅使用 v0.28.1 专用仓库变量。
on:
  workflow_call:
    inputs:
      image:
        description: 待校验的 v0.28.1 镜像完整路径
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docker-image
  cancel-in-progress: false

env:
  HARBOR_SITE: ${{ vars.HARBOR_SITE }}
  HARBOR_NAMESPACE: jenkins/model_test_env
  HCU_CI_IMAGE: ${{ vars.HCU_CI_IMAGE_V0281 }}

jobs:
  validate:
    name: Validate published image
    runs-on:
      - ci
      - bw1000
    steps:
      - name: Authorize release ref
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/v0.28.1-dev" ]]; then
            echo "HCU image validation only accepts v0.28.1-dev" >&2
            exit 2
          fi

      - name: Repair self-hosted workspace before checkout
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          uid="$(id -u)"
          gid="$(id -g)"
          blocked_path="$(find "$GITHUB_WORKSPACE" \( ! -uid "$uid" -o \( -type d ! -writable \) \) -print -quit 2>/dev/null || true)"
          if [[ -z "$blocked_path" ]]; then
            exit 0
          fi
          echo "repairing stale workspace ownership under $GITHUB_WORKSPACE"
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo chown -R "$uid:$gid" "$GITHUB_WORKSPACE"
          elif command -v docker >/dev/null 2>&1; then
            repair_images=()
            if [[ -n "${HCU_CI_IMAGE:-}" ]]; then
              repair_id="$(docker image inspect "$HCU_CI_IMAGE" --format '{{.Id}}' 2>/dev/null || true)"
              [[ -z "$repair_id" ]] || repair_images+=("$repair_id")
            fi
            while IFS= read -r repair_id; do
              [[ -z "$repair_id" ]] || repair_images+=("$repair_id")
            done < <(docker image ls --format '{{.ID}}' | awk '!seen[$0]++')
            repaired=false
            for repair_image in "${repair_images[@]}"; do
              if docker run --rm \
                  --user 0:0 \
                  --entrypoint /bin/sh \
                  --volume "$GITHUB_WORKSPACE:/workspace" \
                  "$repair_image" \
                  -c 'chown -R "$1:$2" /workspace' -- "$uid" "$gid"; then
                repaired=true
                break
              fi
            done
            if [[ "$repaired" != "true" ]]; then
              echo "No local Docker image could repair: $blocked_path" >&2
              exit 1
            fi
          else
            echo "Cannot repair non-writable workspace path: $blocked_path" >&2
            exit 1
          fi
          blocked_path="$(find "$GITHUB_WORKSPACE" \( ! -uid "$uid" -o \( -type d ! -writable \) \) -print -quit 2>/dev/null || true)"
          if [[ -n "$blocked_path" ]]; then
            echo "Workspace ownership or directory permissions are still invalid: $blocked_path" >&2
            exit 1
          fi

      - name: Checkout image source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_SITE }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Resolve latest image digest
        id: image
        env:
          SOURCE_IMAGE: ${{ inputs.image || vars.HCU_CI_IMAGE_V0281 }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_IMAGE:-}" ]]; then
            echo "HCU_CI_IMAGE_V0281 or an explicit image input is required" >&2
            exit 2
          fi
          allowed_repository="${HARBOR_SITE}/${HARBOR_NAMESPACE}/vllm"
          source_repository="${SOURCE_IMAGE%%@*}"
          last_component="${source_repository##*/}"
          if [[ "$last_component" == *:* ]]; then
            source_repository="${source_repository%:*}"
          fi
          if [[ "$source_repository" != "$allowed_repository" ]]; then
            echo "Refusing image outside approved repository: $SOURCE_IMAGE" >&2
            exit 2
          fi
          docker pull "$SOURCE_IMAGE"
          if [[ "$SOURCE_IMAGE" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            digest_image="$SOURCE_IMAGE"
          else
            digest_image="$(
              docker image inspect "$SOURCE_IMAGE" \
                --format '{{range .RepoDigests}}{{println .}}{{end}}' \
                | awk -v prefix="${source_repository}@" 'index($0, prefix) == 1 {print; exit}'
            )"
          fi
          if [[ ! "$digest_image" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Unable to resolve image digest: $SOURCE_IMAGE" >&2
            exit 1
          fi
          echo "source_image=$SOURCE_IMAGE"
          echo "digest=$digest_image"
          echo "digest=$digest_image" >> "$GITHUB_OUTPUT"

      - name: Validate published image
        env:
          DIGEST_IMAGE: ${{ steps.image.outputs.digest }}
        run: |
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --device /dev/kfd:/dev/kfd \
            --device /dev/dri:/dev/dri \
            --ipc=host \
            --network=host \
            -v "$PWD:/vllm-plugin-das:ro" \
            -v /opt/hyhal:/opt/hyhal:ro \
            -w /vllm-plugin-das \
            "$DIGEST_IMAGE" \
            bash -lc '
              set -euo pipefail
              source /opt/dtk/env.sh
              python3 --version
              python3 .github/scripts/hcu_ci/hcu_ci_preflight.py --check-environment-only
              python3 -c '\''import importlib.metadata; import torch; [print(f"{name}={importlib.metadata.version(name)}") for name in ("torch", "vllm", "vllm-hcu", "pytest")]; print(f"torch_hip={torch.version.hip}")'\''
              python3 tools/run_patch_tests.py --suite contract -- -o cache_dir=/tmp/hcu-ci-pytest-cache
              # The checkout is mounted read-only and intentionally has no locally
              # built hcu_ops extension. The source-build smoke remains covered by
              # the selected HCU job, which builds the checkout before execution.
              python3 tools/run_patch_tests.py --suite contract-hcu -- \
                --deselect tests/patch/test_clean_process_bootstrap.py::test_clean_hcu_process_imports_every_enabled_patch_target \
                -o cache_dir=/tmp/hcu-ci-pytest-cache-hcu
            '

      - name: Clean workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
