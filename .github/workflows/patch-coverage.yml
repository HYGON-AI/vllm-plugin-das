name: Patch coverage

on:
  push:
    branches:
      - v0.28.1-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-patch-gate:
    runs-on:
      - self-hosted
      - ci
      - bw1100
    container:
      image: ${{ vars.HCU_CI_IMAGE_V0281 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify every patch has a contract and test reference
        run: |
          python3 --version
          python3 .github/scripts/hcu_ci/hcu_ci_preflight.py --check-lock-only
          python3 tools/check_patch_test_coverage.py
      - name: Compile test and patch tooling
        run: python3 -m compileall -q tools tests

      # Job containers run as root on the host-mounted self-hosted workspace.
      - name: Remove container-owned workspace files
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
