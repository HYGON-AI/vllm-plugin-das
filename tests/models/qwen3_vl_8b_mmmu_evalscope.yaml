name: qwen3_vl_8b_mmmu_evalscope
model: /models/llm-models/qwen3/Qwen3-VL-8B-Instruct
model_type: vllm-vlm

server:
  host: 127.0.0.1
  port: 10131
  startup_timeout_s: 1200
  shutdown_timeout_s: 60
  args:
    - --trust-remote-code
    - --max-model-len
    - "8192"
    - --max-num-batched-tokens
    - "4096"
    - --max-num-seqs
    - "4"
    - --gpu-memory-utilization
    - "0.7"
    - --limit-mm-per-prompt
    - '{"image":7}'
    - --enforce-eager
    - --seed
    - "0"

evalscope:
  work_dir: /tmp/vllm-hcu-evalscope/qwen3_vl_8b_mmmu
  api_key: EMPTY
  eval_type: openai_api
  generation_config:
    temperature: 0
    do_sample: false
    seed: 0
    max_tokens: 512
    top_p: 0.95
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  stream: true
  eval_batch_size: 1
  timeout: 60000
  limit: 10
  datasets:
    - mmmu
  dataset_args:
    mmmu:
      subset_list:
        - Art
  pass_criteria:
    dataset: mmmu
    metric: mean_acc
    display_name: acc
    # This PR smoke test evaluates 10 samples, so require five correct answers.
    minimum_score: 0.50
  no_timestamp: true
